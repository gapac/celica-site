# Builds the Astro site and publishes it to GitHub Pages — MANUAL ONLY until the
# founder decides to go live (Pages was disabled on 2026-10-05 by request).
# To go live: enable Pages (Source: GitHub Actions), then run this workflow from
# the Actions tab; re-add `push: branches: [main]` below for auto-deploys.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without a custom domain, Pages serves from /<repo>/ — tell Astro so links
      # and assets resolve. Adding public/CNAME switches to the real domain.
      - name: Pick site URL and base
        run: |
          if [ -f public/CNAME ]; then
            echo "custom domain: $(cat public/CNAME)"
          else
            echo "ASTRO_SITE=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
            echo "ASTRO_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
