# Builds the Astro site and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
# Until that is done the deploy job fails with "Pages not enabled"; the build
# job still runs, so the site is checked on every push either way.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without a custom domain, Pages serves from /<repo>/ — tell Astro so links
      # and assets resolve. Adding public/CNAME switches to the real domain.
      - name: Pick site URL and base
        run: |
          if [ -f public/CNAME ]; then
            echo "custom domain: $(cat public/CNAME)"
          else
            echo "ASTRO_SITE=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
            echo "ASTRO_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
